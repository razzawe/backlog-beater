server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /_gateway_auth {
        internal;
        proxy_pass http://auth:8000/internal/auth/check;
        proxy_method GET;
        proxy_pass_request_body off;
        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    location = /api/v1/auth/register {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://auth:8000;
    }

    location = /api/v1/auth/login {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://auth:8000;
    }

    location = /api/v1/steam/callback {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://auth:8000;
    }

    location = /api/v1/auth/me {
        include /etc/nginx/snippets/protected.conf;
        proxy_pass http://auth:8000;
    }

    location = /api/v1/steam/link {
        include /etc/nginx/snippets/protected.conf;
        proxy_pass http://auth:8000;
    }

    location = /api/v1/steam/sync {
        include /etc/nginx/snippets/protected.conf;
        proxy_pass http://sync:8000;
    }

    location = /api/v1/recommendations {
        include /etc/nginx/snippets/protected.conf;
        proxy_pass http://recommendation:8000;
    }

    location = /api/v1/games {
        include /etc/nginx/snippets/protected.conf;
        proxy_pass http://library:8000;
    }

    location ^~ /api/v1/enrichment/ {
        include /etc/nginx/snippets/protected.conf;
        proxy_pass http://enrichment:8000;
    }

    location ^~ /api/v1/games/ {
        include /etc/nginx/snippets/protected.conf;
        proxy_pass http://library:8000;
    }

    # Reject internal endpoints, service docs, and unrecognized paths.
    location / {
        return 404;
    }
}
