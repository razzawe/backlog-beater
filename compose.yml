services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: backlog_beater
      POSTGRES_USER: backlog
      POSTGRES_PASSWORD: backlog_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
