services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: backlog_beater
      POSTGRES_USER: backlog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backlog_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backlog -d backlog_beater"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth:
    build:
      context: ./backend
      dockerfile: auth_service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://backlog:${POSTGRES_PASSWORD:-backlog_dev_password}@db:5432/backlog_beater
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env before starting services}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      STEAM_CALLBACK_URL: ${STEAM_CALLBACK_URL:-http://localhost:8080/api/v1/steam/callback}
    networks: [gateway, database, auth_egress]
    depends_on:
      db:
        condition: service_healthy
    healthcheck: &service_health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    command: ["python", "-m", "uvicorn", "auth_service.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "172.30.80.2"]

  library:
    build:
      context: ./backend
      dockerfile: library_service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://backlog:${POSTGRES_PASSWORD:-backlog_dev_password}@db:5432/backlog_beater
    networks: [gateway, database]
    depends_on:
      auth:
        condition: service_healthy
    healthcheck: *service_health
    command: ["python", "-m", "uvicorn", "library_service.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "172.30.80.2"]

  sync:
    build:
      context: ./backend
      dockerfile: sync_service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://backlog:${POSTGRES_PASSWORD:-backlog_dev_password}@db:5432/backlog_beater
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      CATALOG_BROKER_URL: redis://enrichment-redis:6379/0
    networks: [gateway, database, sync_egress, enrichment_queue]
    depends_on:
      auth:
        condition: service_healthy
    healthcheck: *service_health
    command: ["python", "-m", "uvicorn", "sync_service.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "172.30.80.2"]

  enrichment:
    build:
      context: ./backend
      dockerfile: enrichment-service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://backlog:${POSTGRES_PASSWORD:-backlog_dev_password}@db:5432/backlog_beater
      HLTB_REVIEW_CACHE_URL: redis://enrichment-cache:6379/0
      ENRICHMENT_BROKER_URL: redis://enrichment-redis:6379/0
    networks: [gateway, database, enrichment_queue, review_cache]
    depends_on:
      auth:
        condition: service_healthy
      enrichment-cache:
        condition: service_healthy
      enrichment-redis:
        condition: service_healthy
    healthcheck: *service_health
    command: ["python", "-m", "uvicorn", "enrichment_service.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "172.30.80.2"]

  enrichment-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - enrichment_redis_data:/data
    networks: [enrichment_queue]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  enrichment-cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction", "--save", ""]
    networks: [review_cache]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  enrichment-worker:
    build:
      context: ./backend
      dockerfile: enrichment-worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://backlog:${POSTGRES_PASSWORD:-backlog_dev_password}@db:5432/backlog_beater
      ENRICHMENT_BROKER_URL: redis://enrichment-redis:6379/0
      HLTB_REVIEW_CACHE_URL: redis://enrichment-cache:6379/0
    networks: [database, enrichment_queue, enrichment_egress, review_cache]
    depends_on:
      db:
        condition: service_healthy
      enrichment-redis:
        condition: service_healthy
      enrichment-cache:
        condition: service_healthy
    command: ["python", "-m", "celery", "-A", "enrichment_worker.worker:app", "worker", "--loglevel=INFO", "--queues=enrichment", "--concurrency=1", "--hostname=enrichment@%h"]
    healthcheck:
      test: ["CMD-SHELL", "python -m celery -A enrichment_worker.worker:app inspect ping --destination=enrichment@$$HOSTNAME --timeout=3 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/common.conf:/etc/nginx/snippets/common.conf:ro
      - ./gateway/proxy.conf:/etc/nginx/snippets/proxy.conf:ro
      - ./gateway/protected.conf:/etc/nginx/snippets/protected.conf:ro
    networks:
      gateway:
        ipv4_address: 172.30.80.2
      frontend:
    depends_on:
      auth:
        condition: service_healthy
      library:
        condition: service_healthy
      sync:
        condition: service_healthy
      enrichment:
        condition: service_healthy

networks:
  gateway:
    internal: true
    ipam:
      config:
        - subnet: 172.30.80.0/24
          ip_range: 172.30.80.128/25
  database:
    internal: true
  frontend:
  auth_egress:
  sync_egress:
  enrichment_egress:
  enrichment_queue:
    internal: true
  review_cache:
    internal: true

volumes:
  postgres_data:
  enrichment_redis_data:
