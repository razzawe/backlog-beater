[project]
name = "backlog-beater-backend"
version = "0.1.0"
requires-python = ">=3.11,<4.0"
dependencies = [
    "celery[redis]==5.6.3",
    "howlongtobeatpy==1.0.24",
    "httpx>=0.27,<1.0",
    "fastapi[standard]>=0.115,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "pyjwt>=2.8,<3.0",
    "sqlmodel>=0.0.22,<1.0",
]

[tool.fastapi]
entrypoint = "auth_service.main:app"
