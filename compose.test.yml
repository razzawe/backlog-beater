services:
  test-db:
    image: postgres:17
    environment:
      POSTGRES_DB: steam_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d steam_test"]
      interval: 2s
      timeout: 2s
      retries: 20
  test-cache:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
  tests:
    image: python:3.11-slim
    working_dir: /workspace/backend
    volumes:
      - .:/workspace:ro
    environment:
      DATABASE_URL: postgresql+psycopg://test:test@test-db:5432/steam_test
      HLTB_REVIEW_CACHE_URL: redis://test-cache:6379/0
      SECRET_KEY: isolated-test-secret-key-at-least-32-characters
      PYTHONPATH: /workspace/backend:/workspace/backend/metadata-worker
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      test-db:
        condition: service_healthy
      test-cache:
        condition: service_healthy
    command:
      - python
      - -c
      - |
        import subprocess, sys, tomllib
        with open('pyproject.toml', 'rb') as source:
            dependencies = tomllib.load(source)['project']['dependencies']
        subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--quiet', *dependencies, '-r', 'image-worker/requirements.txt'])
        sys.exit(subprocess.call([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-v']))
